<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#F5F4EF"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="58" y="58" font-size="21" font-weight="700" fill="#151713">Mandate</text><text x="58" y="105" font-size="16" font-weight="700" fill="#176B50">THE WORLD</text><text x="1142" y="62" font-size="16" font-weight="650" fill="#8B9088" text-anchor="end">05 / 06</text><text x="58" y="158" font-size="46" font-weight="680" fill="#151713">The future is hybrid.</text><text x="58" y="197" font-size="22" fill="#656A63">Agents need fiat rails and machine-native rails to behave like one economy.</text><rect x="58" y="252" width="420" height="334" rx="26" fill="#FFFFFF" stroke="#D8DBD4"/><rect x="722" y="252" width="420" height="334" rx="26" fill="#FFFFFF" stroke="#D8DBD4"/><rect x="84" y="276" width="130" height="34" rx="17" fill="#EFEEE8"/><text x="149" y="299" font-size="14" font-weight="700" fill="#656A63" text-anchor="middle">FIAT WORLD</text><rect x="918" y="276" width="190" height="34" rx="17" fill="#E3EDF1"/><text x="1013" y="299" font-size="14" font-weight="700" fill="#315F76" text-anchor="middle">MACHINE-NATIVE</text><g font-size="19" font-weight="650" fill="#151713"><text x="102" y="356">Bank accounts</text><text x="102" y="412">ACH / wire</text><text x="102" y="468">Cards</text><text x="102" y="524">Stripe / PayPal</text><text x="766" y="356">Wallets</text><text x="766" y="412">Stablecoins</text><text x="766" y="468">Onchain transfer</text><text x="766" y="524">x402 / machine pay</text></g><g fill="#176B50"><circle cx="82" cy="350" r="7"/><circle cx="82" cy="406" r="7"/><circle cx="82" cy="462" r="7"/><circle cx="82" cy="518" r="7"/></g><g fill="#315F76"><circle cx="746" cy="350" r="7"/><circle cx="746" cy="406" r="7"/><circle cx="746" cy="462" r="7"/><circle cx="746" cy="518" r="7"/></g><circle cx="600" cy="420" r="112" fill="#176B50"/><text x="600" y="398" font-size="17" font-weight="750" fill="#FFFFFF" text-anchor="middle">MANDATE</text><text x="600" y="438" font-size="34" font-weight="760" fill="#FFFFFF" text-anchor="middle">hybrid</text><text x="600" y="469" font-size="22" font-weight="620" fill="#EDF6F1" text-anchor="middle">by design</text><path d="M478 390 C520 390 525 405 535 414" stroke="#176B50" stroke-width="4" fill="none"/><path d="M665 414 C675 405 680 390 722 390" stroke="#176B50" stroke-width="4" fill="none"/><path d="M478 474 C515 474 526 460 535 450" stroke="#176B50" stroke-width="4" fill="none"/><path d="M665 450 C674 460 685 474 722 474" stroke="#176B50" stroke-width="4" fill="none"/><text x="58" y="672" font-size="22" font-weight="630" fill="#656A63">Crypto-only misses cards and banks.</text><text x="1142" y="672" font-size="22" font-weight="630" fill="#656A63" text-anchor="end">Fiat-only misses machine commerce.</text></g></svg>