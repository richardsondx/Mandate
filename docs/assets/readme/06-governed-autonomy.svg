<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#F5F4EF"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="58" y="58" font-size="21" font-weight="700" fill="#151713">Mandate</text><text x="58" y="105" font-size="16" font-weight="700" fill="#176B50">THE CONTROL PLANE</text><text x="1142" y="62" font-size="16" font-weight="650" fill="#8B9088" text-anchor="end">06 / 06</text><text x="58" y="158" font-size="46" font-weight="680" fill="#151713">Autonomy needs authority and evidence.</text><text x="58" y="197" font-size="22" fill="#656A63">Powerful enough to act. Explicit enough to trust.</text><rect x="58" y="292" width="230" height="190" rx="22" fill="#FFFFFF" stroke="#D8DBD4"/><rect x="80" y="314" width="88" height="34" rx="17" fill="#EFEEE8"/><text x="124" y="337" font-size="14" font-weight="700" fill="#656A63" text-anchor="middle">AGENT</text><text x="80" y="390" font-size="27" font-weight="700" fill="#151713">“Pay $22</text><text x="80" y="423" font-size="27" font-weight="700" fill="#151713">to GitHub”</text><text x="80" y="460" font-size="17" fill="#656A63">one intent</text><rect x="368" y="252" width="464" height="300" rx="26" fill="#151713"/><text x="398" y="293" font-size="15" font-weight="700" fill="#9FE2C0">MANDATE EXECUTION</text><g fill="#FFFFFF"><circle cx="404" cy="334" r="14" fill="#176B50"/><text x="404" y="340" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="432" y="332" font-size="18" font-weight="680">Authenticate</text><text x="432" y="351" font-size="14" fill="#C9D0C9">scoped agent credential</text><circle cx="404" cy="384" r="14" fill="#176B50"/><text x="404" y="390" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="432" y="382" font-size="18" font-weight="680">Authorize</text><text x="432" y="401" font-size="14" fill="#C9D0C9">merchant + amount bounds</text><circle cx="404" cy="434" r="14" fill="#176B50"/><text x="404" y="440" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="432" y="432" font-size="18" font-weight="680">Reserve</text><text x="432" y="451" font-size="14" fill="#C9D0C9">position stays explicit</text><circle cx="404" cy="484" r="14" fill="#176B50"/><text x="404" y="490" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="432" y="482" font-size="18" font-weight="680">Record</text><text x="432" y="501" font-size="14" fill="#C9D0C9">double-entry evidence</text></g><rect x="912" y="272" width="230" height="242" rx="22" fill="#FFFFFF" stroke="#D8DBD4"/><rect x="934" y="294" width="112" height="34" rx="17" fill="#EDF6F1"/><text x="990" y="317" font-size="14" font-weight="700" fill="#176B50" text-anchor="middle">ROUTE</text><text x="934" y="370" font-size="19" font-weight="670" fill="#151713">Coinbase</text><text x="934" y="401" font-size="19" font-weight="670" fill="#656A63">→ bridge</text><text x="934" y="432" font-size="19" font-weight="670" fill="#151713">→ Lithic</text><text x="934" y="472" font-size="17" font-weight="700" fill="#176B50">GitHub only</text><text x="934" y="499" font-size="16" fill="#656A63">$22 ceiling</text><line x1="289" y1="387" x2="352" y2="387" stroke="#176B50" stroke-width="4"/><line x1="833" y1="387" x2="895" y2="387" stroke="#176B50" stroke-width="4"/><rect x="368" y="580" width="464" height="54" rx="16" fill="#EDF6F1" stroke="#C9E0D4"/><text x="390" y="613" font-size="16" font-weight="650" fill="#176B50">✓ authority checked   ✓ funds reserved   ✓ ledger evidence posted</text><text x="58" y="672" font-size="22" font-weight="650" fill="#656A63">Autonomy does not mean blind access.</text><text x="1142" y="672" font-size="24" font-weight="700" fill="#176B50" text-anchor="end">Freedom + boundaries + evidence.</text></g></svg>