h="230" height="56" rx="14" fill="#EDF6F1"/><text x="866" y="472">Transfer funds</text><rect x="86" y="516" width="230" height="56" rx="14" fill="#E3EDF1"/><text x="110" y="550">Issue refunds</text><rect x="338" y="516" width="230" height="56" rx="14" fill="#E3EDF1"/><text x="362" y="550">Reconcile</text><rect x="590" y="516" width="230" height="56" rx="14" fill="#E3EDF1"/><text x="614" y="550">Reuse earnings</text><rect x="842" y="516" width="230" height="56" rx="14" fill="#E3EDF1"/><text x="866" y="550">Audit evidence</text></g><text x="58" y="672" font-size="23" font-weight="650" fill="#656A63">Payments are one primitive.</text><text x="1142" y="672" font-size="24" font-weight="700" fill="#176B50" text-anchor="end">The product is the full economic surface.</text></g></svg>