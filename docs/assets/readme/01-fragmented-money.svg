"#FFFFFF" opacity="1" stroke="#D8DBD4" stroke-width="1.5" filter="url(#shadow)"/><rect x="908" y="310" width="92" height="34" rx="17" fill="#EFEEE8" opacity="1"/><text x="954.0" y="333" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="650" fill="#656A63" text-anchor="middle" letter-spacing="0.5" opacity="1">SPEND</text><text x="910" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" font-weight="670" fill="#151713" text-anchor="start" letter-spacing="0" opacity="1">Card provider</text><text x="910" y="422" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="600" fill="#B42318" text-anchor="start" letter-spacing="0" opacity="1">$0 funded</text><rect x="892" y="520" width="238" height="84" rx="18" fill="#151713" opacity="1"/><text x="914" y="554" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="650" fill="#F5F4EF" text-anchor="start" letter-spacing="0" opacity="1">SaaS merchant</text><text x="914" y="583" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="480" fill="#C9D0C9" text-anchor="start" letter-spacing="0" opacity="1">accepts card only</text><line x1="307" y1="377" x2="458" y2="377" stroke="#B42318" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="10 9"/><line x1="719" y1="377" x2="870" y2="377" stroke="#B42318" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="10 9"/><line x1="1010" y1="464" x2="1010" y2="505" stroke="#B42318" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="10 9"/><circle cx="382" cy="377" r="18" fill="#FBE4E2" opacity="1" stroke="#B42318" stroke-width="1.5"/><text x="382" y="383" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="700" fill="#B42318" text-anchor="middle" letter-spacing="0" opacity="1">×</text><ci