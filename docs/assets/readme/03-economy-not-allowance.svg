<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#151713" flood-opacity="0.08"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176B50"/></marker><pattern id="dotgrid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#D8DBD4" opacity=".55"/></pattern></defs><rect width="1200" height="720" fill="#F5F4EF"/><rect width="1200" height="720" fill="url(#dotgrid)" opacity=".18"/><g transform="translate(58,38)"><line x1="4" y1="18" x2="-1" y2="3" stroke="#176B50" stroke-width="4" stroke-linecap="round"/><line x1="12" y1="18" x2="16" y2="8" stroke="#176B50" stroke-width="4" stroke-linecap="round"/><line x1="20" y1="18" x2="25" y2="3" stroke="#176B50" stroke-width="4" stroke-linecap="round"/></g><text x="96" y="55" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#151713">Mandate</text><text x="58" y="105" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#176B50" letter-spacing="1.7">THE LIFECYCLE</text><text x="1142" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="650" fill="#8B9088" text-anchor="end">03 / 06</text><text x="58" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="46" font-weight="680" fill="#151713" letter-spacing="-1.4">Give the agent an economy, not an allowance.</text><text x="58" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#656A63">Economic autonomy is the loop: earn → spend → reinvest → keep going.</text><circle cx="600" cy="440" r="86" fill="#151713"/><text x="600" y="429" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#9FE2C0" text-anchor="middle">AGENT</text><text x="600" y="462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#F5F4EF" text-anchor="middle">still operating</text><text x="600" y="489" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#C9D0C9" text-anchor="middle">months later</text><rect x="495" y="241" width="210" height="68" rx="18" fill="#EDF6F1" stroke="#D8DBD4" filter="url(#shadow)"/><text x="600" y="283" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="680" fill="#176B50" text-anchor="middle">Create value</text><rect x="730" y="316" width="210" height="68" rx="18" fill="#FFF" stroke="#D8DBD4" filter="url(#shadow)"/><text x="835" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="680" fill="#151713" text-anchor="middle">Earn</text><rect x="730" y="486" width="210" height="68" rx="18" fill="#FFF" stroke="#D8DBD4" filter="url(#shadow)"/><text x="835" y="528" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="680" fill="#151713" text-anchor="middle">Hold</text><rect x="260" y="486" width="210" height="68" rx="18" fill="#FFF" stroke="#D8DBD4" filter="url(#shadow)"/><text x="365" y="528" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="680" fill="#151713" text-anchor="middle">Spend</text><rect x="260" y="316" width="210" height="68" rx="18" fill="#FFF" stroke="#D8DBD4" filter="url(#shadow)"/><text x="365" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="680" fill="#151713" text-anchor="middle">Reinvest</text><path d="M 687 301 C 745 303, 785 316, 817 337" stroke="#176B50" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 876 384 C 905 425, 905 465, 875 502" stroke="#176B50" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 730 552 C 666 597, 535 597, 470 552" stroke="#176B50" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 324 502 C 294 462, 294 415, 324 376" stroke="#176B50" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 383 337 C 421 309, 473 298, 512 299" stroke="#176B50" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="58" y="278" width="220" height="126" rx="20" fill="#FFF" stroke="#D8DBD4"/><text x="82" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#8B9088">DAY 0</text><text x="82" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="40" font-weight="760" fill="#151713">$100</text><text x="82" y="387" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#656A63">initial seed</text><rect x="58" y="435" width="220" height="126" rx="20" fill="#FBE4E2" stroke="#F0C8C4"/><text x="82" y="471" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#B42318">NO HUMAN TOP-UPS</text><text x="82" y="514" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="760" fill="#B42318">$0</text><text x="82" y="543" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#B42318">after the seed</text><text x="58" y="672" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="650" fill="#B42318">Allowance = money runs out.</text><text x="1142" y="672" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#176B50" text-anchor="end">Economy = earnings become operating capital.</text></svg>